<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#092329">
  <title>CORI Founder Hub</title>
  <link rel="icon" type="image/png" href="cori-logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="mast">
    <div class="mast-inner">
      <a class="brand" href="#/leads" aria-label="CORI Founder Hub, home">
        <span class="brand-logo"><img src="cori-logo.png" alt="" width="46" height="38"></span>
        <span class="brand-text">
          <span class="brand-name">Founder Hub</span>
          <span class="brand-sub">Center on Rural Innovation</span>
        </span>
      </a>
      <nav id="main-nav" class="main-nav" aria-label="Main"></nav>
      <div id="user-menu" class="user-slot"></div>
    </div>
  </header>
  <main id="main" class="main" tabindex="-1">
    <p class="loading" role="status">Loading the hub…</p>
  </main>
  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>Founder Hub. A members-only network of the Center on Rural Innovation.</span>
      <span>Contact details are never shown. Every introduction goes through a member.</span>
    </div>
  </footer>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">The Founder Hub needs JavaScript enabled.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
